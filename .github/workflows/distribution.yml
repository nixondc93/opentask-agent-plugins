name: Distribution parity and dry-run

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution parity and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate package parity and hosted-only shape
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { existsSync, readFileSync, readdirSync, statSync } = require("node:fs");
          const { join } = require("node:path");

          const expectedVersion = "0.3.2";
          const expectedMcpUrl = "https://opentask.ai/mcp";
          const expectedWorkflows = [
            "bid",
            "contract",
            "find-work",
            "payment",
            "profile",
            "review",
            "setup",
            "submit",
          ];

          function fail(message) {
            throw new Error(message);
          }

          function read(path) {
            return readFileSync(path, "utf8");
          }

          function json(path) {
            return JSON.parse(read(path));
          }

          function equal(actual, expected, label) {
            if (actual !== expected) {
              fail(`${label}: expected ${JSON.stringify(expected)}, received ${JSON.stringify(actual)}`);
            }
          }

          const versions = [
            ["Codex plugin", json("plugins/opentask/.codex-plugin/plugin.json").version],
            ["Claude plugin", json("plugins/claude-opentask/.claude-plugin/plugin.json").version],
            ["Claude marketplace", json("plugins/claude-opentask/.claude-plugin/marketplace.json").plugins[0].version],
            ["OpenClaw package", json("plugins/openclaw-opentask/package.json").version],
            ["OpenClaw plugin", json("plugins/openclaw-opentask/openclaw.plugin.json").version],
            ["OpenClaw Claude manifest", json("plugins/openclaw-opentask/.claude-plugin/plugin.json").version],
            ["Root Claude marketplace", json(".claude-plugin/marketplace.json").plugins[0].version],
          ];
          for (const [label, version] of versions) {
            equal(version, expectedVersion, `${label} version`);
          }

          for (const host of ["opentask", "claude-opentask", "openclaw-opentask"]) {
            const config = json(`plugins/${host}/.mcp.json`);
            const server = config.mcpServers?.opentask;
            equal(server?.url, expectedMcpUrl, `${host} MCP URL`);
            if ("command" in server || "args" in server) {
              fail(`${host} must not declare a local MCP runtime`);
            }
          }

          const codexSkillsRoot = "plugins/opentask/skills";
          const codexWorkflows = readdirSync(codexSkillsRoot)
            .filter((entry) => entry !== "opentask-agent")
            .filter((entry) => statSync(join(codexSkillsRoot, entry)).isDirectory())
            .sort();
          equal(
            JSON.stringify(codexWorkflows),
            JSON.stringify([...expectedWorkflows].sort()),
            "Codex workflow skill set",
          );
          for (const workflow of expectedWorkflows) {
            const skillPath = join(codexSkillsRoot, workflow, "SKILL.md");
            const metadataPath = join(codexSkillsRoot, workflow, "agents", "openai.yaml");
            if (!existsSync(skillPath) || !existsSync(metadataPath)) {
              fail(`${workflow} must include SKILL.md and agents/openai.yaml`);
            }
            if (!read(skillPath).includes("../opentask-agent/SKILL.md")) {
              fail(`${workflow} must load the canonical opentask-agent policy`);
            }
            if (!read(metadataPath).includes(`$${workflow}`)) {
              fail(`${workflow} metadata must invoke $${workflow}`);
            }
          }

          const canonicalRoot = join(codexSkillsRoot, "opentask-agent");
          const canonicalFiles = [
            "SKILL.md",
            "HEARTBEAT.md",
            "MESSAGING.md",
            "references/api-recipes.md",
            "references/delivery.md",
            "references/protocol.md",
            "references/quality-bar.md",
            "references/secure-handoffs.md",
          ];
          for (const relativePath of canonicalFiles) {
            const source = read(join(canonicalRoot, relativePath));
            const expectedHash = createHash("sha256").update(source).digest("hex");
            for (const host of ["claude-opentask", "openclaw-opentask"]) {
              const copy = read(join("plugins", host, "skills", "opentask-agent", relativePath));
              const copyHash = createHash("sha256").update(copy).digest("hex");
              equal(copyHash, expectedHash, `${host} ${relativePath} parity`);
            }
          }

          const executableExtensions = new Set([
            ".bash", ".cjs", ".js", ".mjs", ".py", ".sh", ".ts", ".tsx", ".wasm", ".zsh",
          ]);
          function walk(path) {
            for (const entry of readdirSync(path, { withFileTypes: true })) {
              const child = join(path, entry.name);
              if (entry.isDirectory()) {
                walk(child);
                continue;
              }
              const dot = entry.name.lastIndexOf(".");
              const extension = dot >= 0 ? entry.name.slice(dot).toLowerCase() : "";
              if (executableExtensions.has(extension)) {
                fail(`Distribution must remain declarative; found executable source ${child}`);
              }
            }
          }
          walk("plugins");

          console.log("Distribution manifests, hosted MCP declarations, workflow metadata, and canonical docs are consistent.");
          NODE

      - name: Dry-run immutable ClawHub package
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          npx --yes clawhub@0.18.0 package publish "${GITHUB_REPOSITORY}@${RELEASE_SHA}" \
            --source-path plugins/openclaw-opentask \
            --family bundle-plugin \
            --name @opentask/openclaw \
            --display-name "OpenTask Agent Marketplace" \
            --owner opentask \
            --version 0.3.2 \
            --bundle-format claude \
            --host-targets openclaw \
            --tags latest \
            --dry-run \
            --json > /tmp/opentask-clawhub-dry-run.json
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const result = JSON.parse(readFileSync("/tmp/opentask-clawhub-dry-run.json", "utf8"));
          if (result.version !== "0.3.2") throw new Error("ClawHub dry-run version mismatch");
          if (result.commit !== process.env.RELEASE_SHA) throw new Error("ClawHub dry-run commit mismatch");
          if (result.name !== "@opentask/openclaw") throw new Error("ClawHub dry-run package mismatch");
          if (!Number.isInteger(result.files) || result.files < 10) throw new Error("ClawHub artifact is unexpectedly small");
          console.log(`ClawHub dry-run accepted ${result.files} files from ${result.commit}.`);
          NODE
