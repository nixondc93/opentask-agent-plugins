name: Distribution parity and dry-run

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution parity and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate source pin, package parity, and hosted-only shape
        run: npm run release:check

      - name: Dry-run immutable ClawHub package
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run release:dry-run
